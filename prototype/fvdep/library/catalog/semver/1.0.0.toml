dep = "semver"
version = "1.0.0"
title = "Semantic Versioning 2.0.0: parse + precedence"
standard = "semver.org 2.0.0 §2, §9–§11"
module = "Fvdep.Semver.V1_0_0"
source = "Fvdep/Semver/V1_0_0.lean"
models = ["npm:semver", "crates:semver", "pypi:semver"]
summary = "Strict version grammar and precedence order. Ranges (^1.2, ~1.2) are not in this version."

[[ops]]
name = "parse"
args = ["text"]
result = "normalized version text | err"

[[ops]]
name = "compare"
args = ["text", "text"]
result = "lt | eq | gt | err"

[[obligations]]
theorem = "Fvdep.Semver.V1_0_0.compare_refl"
says = "Every version equals itself in precedence."

[[obligations]]
theorem = "Fvdep.Semver.V1_0_0.compare_swap"
says = "a < b exactly when b > a."

[[obligations]]
theorem = "Fvdep.Semver.V1_0_0.compare_ignores_build"
says = "Build metadata never changes precedence."

[[obligations]]
theorem = "Fvdep.Semver.V1_0_0.compare_trans"
says = "Precedence is transitive."

[[obligations]]
theorem = "Fvdep.Semver.V1_0_0.parse_render"
says = "Every valid version renders to text that parses back to it."
