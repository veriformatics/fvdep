package = "npm:semver"
version = "7.7.3"
title = "npm semver"
measured = "semver 7.7.3 on Node 26.13.0"
lean = "Fvdep.Profiles.NpmSemver.V7_7_3"
source = "Fvdep/Profiles/NpmSemver/V7_7_3.lean"
adapter = "node packages/npm-semver/adapter.mjs"
setup = "pnpm install --silent --dir packages/npm-semver"

[[ops]]
op = "parse"
api = "semver.valid(text)"
contract = "semver.parse@1.1.0"
relations = [
  { theorem = "Fvdep.Profiles.NpmSemver.V7_7_3.parse_exact", says = "Complete: the package accepts a text of at most 256 characters exactly when the contract accepts it after trimming whitespace and dropping one leading v, with major, minor and patch at most 2^53 - 1; it returns the contract's version without build metadata.", complete = true },
]

[[ops.deviations]]
name = "build-metadata-dropped"
says = "Returns the version without its build metadata (1.0.0+build gives 1.0.0)."
witness = "1.0.0+build"
theorem = "Fvdep.Profiles.NpmSemver.V7_7_3.dev_build_dropped"

[[ops.deviations]]
name = "v-prefix-accepted"
says = "Accepts one leading v (v1.2.3 gives 1.2.3)."
witness = "v1.2.3"
theorem = "Fvdep.Profiles.NpmSemver.V7_7_3.dev_v_prefix"

[[ops.deviations]]
name = "whitespace-trimmed"
says = "Ignores whitespace before and after the version (' 1.2.3 ' gives 1.2.3)."
witness = " 1.2.3 "
theorem = "Fvdep.Profiles.NpmSemver.V7_7_3.dev_whitespace_trimmed"

[[ops.deviations]]
name = "longer-than-256-rejected"
says = "Rejects any text longer than 256 characters (UTF-16 code units), even a valid version."
witness = "1.0.0- followed by 251 letters a"
theorem = "Fvdep.Profiles.NpmSemver.V7_7_3.dev_too_long"

[[ops.deviations]]
name = "unsafe-core-number-rejected"
says = "Rejects a major, minor or patch number above 2^53 - 1, the largest whole number JavaScript stores exactly (9007199254740992.0.0)."
witness = "9007199254740992.0.0"
theorem = "Fvdep.Profiles.NpmSemver.V7_7_3.dev_unsafe_core"

[[ops]]
op = "compare"
api = "semver.compare(a, b)"
contract = "semver.compare@1.1.0"
relations = [
  { theorem = "Fvdep.Profiles.NpmSemver.V7_7_3.agrees", says = "Where every numeric pre-release identifier is below 2^53, the package compares exactly as the contract." },
  { theorem = "Fvdep.Profiles.NpmSemver.V7_7_3.compare_exact", says = "Complete: same as the contract, except that with equal major, minor and patch, if the first differing pre-release identifiers are two numbers that JavaScript rounds to the same value, the package says equal.", complete = true },
]

[[ops.deviations]]
name = "large-numeric-ids-rounded"
says = "Compares numeric pre-release identifiers of 2^53 and above after rounding them to JavaScript numbers, so 1.0.0-9007199254740993 and 1.0.0-9007199254740992 compare equal; the first such tie ends the comparison."
witness = "1.0.0-9007199254740993 vs 1.0.0-9007199254740992"
theorem = "Fvdep.Profiles.NpmSemver.V7_7_3.dev_rounded_ids"
