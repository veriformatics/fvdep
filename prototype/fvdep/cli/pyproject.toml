[project]
name = "fvdep"
version = "0.0.1"
description = "Prototype CLI: catalog, conformance check + update following for formally specified dependencies"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fvdep = "fvdep.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fvdep"]
